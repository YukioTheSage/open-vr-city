<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open VR City — Central Plaza v0.1</title>
  <style>
    body { margin: 0; overflow: hidden; background: #090d16; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(9, 13, 22, 0.75); color: #e2e8f0;
      padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; line-height: 1.5; backdrop-filter: blur(8px);
    }
    #hud strong { color: #38bdf8; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div><strong>Open VR City</strong> — Central Plaza (v0.1)</div>
    <div id="status">Connecting to multiplayer server...</div>
    <div style="opacity: 0.7; margin-top: 4px;">WASD to move • Drag mouse to look • Click VR button for headset</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // Scene & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);
    scene.fog = new THREE.FogExp2(0x090d16, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
    const rig = new THREE.Group();
    rig.position.set(0, 1.6, 12);
    rig.add(camera);
    scene.add(rig);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // Lighting
    scene.add(new THREE.HemisphereLight(0x38bdf8, 0x0f172a, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // City Plaza Floor & Grid
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(200, 100, 0x38bdf8, 0x1e293b));

    // Central Plaza Monument
    const monument = new THREE.Mesh(
      new THREE.OctahedronGeometry(2.2, 0),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.6, wireframe: true })
    );
    monument.position.set(0, 4, 0);
    scene.add(monument);

    // Procedural City Block Buildings
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.2 });
    const accentMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

    for (let x = -48; x <= 48; x += 12) {
      for (let z = -48; z <= 48; z += 12) {
        if (Math.abs(x) < 18 && Math.abs(z) < 18) continue; // Keep Central Plaza open
        const h = 8 + Math.abs(Math.sin(x * 13.7 + z * 7.3)) * 28;
        const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), buildingMat);
        b.position.set(x, h / 2, z);
        scene.add(b);

        const trim = new THREE.Mesh(new THREE.BoxGeometry(8.1, 0.25, 8.1), accentMat);
        trim.position.set(x, h - 0.5, z);
        scene.add(trim);
      }
    }

    // Multiplayer Avatars
    const avatars = new Map();
    let myId = null;

    function createAvatar(player) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35, 1.0, 4, 8),
        new THREE.MeshStandardMaterial({ color: player.color, emissive: player.color, emissiveIntensity: 0.25 })
      );
      body.position.y = 0.9;
      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.18, 0.2),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      visor.position.set(0, 1.45, -0.28);
      group.add(body, visor);
      group.position.set(player.x, 0, player.z);
      scene.add(group);
      return group;
    }

    const statusEl = document.getElementById('status');
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${protocol}://${location.host}`);

    function updateStatus() {
      statusEl.textContent = `Online • ${avatars.size + 1} player(s) in Central Plaza`;
    }

    ws.onopen = () => updateStatus();
    ws.onerror = () => { statusEl.textContent = 'Offline / Solo Mode (start server.js for multiplayer)'; };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'init') {
        myId = msg.id;
        msg.players.forEach((p) => {
          if (p.id !== myId) avatars.set(p.id, createAvatar(p));
        });
        updateStatus();
      } else if (msg.type === 'join' && msg.player.id !== myId) {
        avatars.set(msg.player.id, createAvatar(msg.player));
        updateStatus();
      } else if (msg.type === 'move' && avatars.has(msg.player.id)) {
        const av = avatars.get(msg.player.id);
        av.position.set(msg.player.x, 0, msg.player.z);
        av.rotation.y = msg.player.ry;
      } else if (msg.type === 'leave' && avatars.has(msg.id)) {
        scene.remove(avatars.get(msg.id));
        avatars.delete(msg.id);
        updateStatus();
      }
    };

    // Desktop Controls (WASD + Drag Look)
    const keys = {};
    window.addEventListener('keydown', (e) => (keys[e.code] = true));
    window.addEventListener('keyup', (e) => (keys[e.code] = false));

    let dragging = false, lastX = 0, yaw = 0;
    window.addEventListener('mousedown', (e) => { dragging = true; lastX = e.clientX; });
    window.addEventListener('mouseup', () => (dragging = false));
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - lastX) * 0.005;
      lastX = e.clientX;
      rig.rotation.y = yaw;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render & Sync Loop
    let lastSync = 0;
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    renderer.setAnimationLoop((time) => {
      monument.rotation.y += 0.008;
      monument.rotation.x += 0.004;

      const speed = 0.14;
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

      if (keys['KeyW'] || keys['ArrowUp']) rig.position.addScaledVector(forward, speed);
      if (keys['KeyS'] || keys['ArrowDown']) rig.position.addScaledVector(forward, -speed);
      if (keys['KeyA'] || keys['ArrowLeft']) rig.position.addScaledVector(right, -speed);
      if (keys['KeyD'] || keys['ArrowRight']) rig.position.addScaledVector(right, speed);

      if (ws.readyState === 1 && time - lastSync > 50) {
        lastSync = time;
        ws.send(JSON.stringify({
          type: 'move',
          x: rig.position.x,
          y: rig.position.y,
          z: rig.position.z,
          ry: rig.rotation.y,
        }));
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
