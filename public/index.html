<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open VR City — Central Plaza</title>
  <style>
    body { margin: 0; overflow: hidden; background: #090d16; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(9, 13, 22, 0.78); color: #e2e8f0;
      padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; line-height: 1.5; backdrop-filter: blur(8px);
      user-select: none; max-width: min(560px, calc(100vw - 32px));
    }
    #hud strong { color: #38bdf8; }
    #perf {
      margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; color: #93c5fd;
    }
    .hud-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .hud-btn {
      background: rgba(56, 189, 248, 0.16); color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 6px;
      padding: 4px 9px; font-size: 11.5px; cursor: pointer; font-family: inherit;
    }
    .hud-btn:hover { background: rgba(56, 189, 248, 0.28); }
    .hud-btn.is-off {
      background: rgba(100, 116, 139, 0.18); color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.3);
    }
    #radar-wrap {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      background: rgba(9, 13, 22, 0.8); color: #cbd5e1;
      padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px); user-select: none; text-align: center;
      font-size: 11px;
    }
    #cull-radar { display: block; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
    .radar-legend { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; opacity: 0.9; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div><strong>Open VR City</strong> — Central Plaza</div>
    <div id="status">Connecting to multiplayer server...</div>
    <div id="perf">160 buildings • initializing occlusion culler...</div>
    <div style="opacity: 0.7; margin-top: 4px;">WASD to move • Drag mouse to look • Click VR button for headset</div>
    <div class="hud-actions">
      <button id="toggle-occlusion" class="hud-btn" type="button" aria-pressed="true">Occlusion Culling: ON (O)</button>
      <button id="toggle-radar" class="hud-btn" type="button" aria-pressed="true">Cull Radar: ON (M)</button>
    </div>
  </div>

  <div id="radar-wrap">
    <canvas id="cull-radar" width="156" height="156" aria-label="Top-down occlusion culling radar"></canvas>
    <div class="radar-legend">
      <span><i class="dot" style="background:#38bdf8"></i>Visible</span>
      <span><i class="dot" style="background:#f43f5e"></i>Occluded</span>
      <span><i class="dot" style="background:#334155"></i>Frustum</span>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
